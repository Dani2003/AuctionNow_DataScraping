name: Weekly PK Market Scrape

on:
  schedule:
    - cron: "0 2 * * 1"   # every Monday, 02:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly scrape
        run: python -m scripts.run_weekly

      - name: Upload run report
        uses: actions/upload-artifact@v4
        with:
          name: new-models-report
          path: runs/

      - name: Commit updated fingerprint store
        run: |
          git config user.name "pk-market-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add storage/fingerprints.json
          git diff --cached --quiet || git commit -m "Update fingerprint store [skip ci]"
          git push

